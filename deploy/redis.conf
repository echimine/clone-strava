# Config Redis montée en lecture seule dans le conteneur (ADR-018 §5).
# Le mot de passe vit ICI (fichier monté), jamais en argument `command:` (visible via
# `docker inspect`/`docker history`). Remplacer <REDIS_PASSWORD> par la vraie valeur
# UNIQUEMENT sur le VPS (fichier hors repo, chmod 600) -- ne jamais committer de valeur réelle.
appendonly yes
appendfsync everysec
maxmemory-policy noeviction
requirepass <REDIS_PASSWORD>
