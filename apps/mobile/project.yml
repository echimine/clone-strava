# StravaClone iOS app (ADR-002, ADR-006, ADR-007).
# Outside the pnpm workspace and Turbo (ADR-005). This file is the source of truth:
# StravaClone.xcodeproj and StravaClone/Info.plist are generated and gitignored.
#
# Setup:
#   1. brew install xcodegen
#   2. cp Config/Secrets.xcconfig.example Config/Secrets.xcconfig   # then fill in the values (optional to build)
#   3. xcodegen generate && open StravaClone.xcodeproj

name: StravaClone

options:
  bundleIdPrefix: fr.echimine
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Release.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 7.11.1
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios
    from: 5.91.0
  PostHog:
    url: https://github.com/PostHog/posthog-ios
    from: 3.82.0
  # Binary deps (MapboxCommon, MapboxCoreMaps) come from api.mapbox.com; no ~/.netrc token needed as of 11.31.
  MapboxMaps:
    url: https://github.com/mapbox/mapbox-maps-ios
    from: 11.31.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 8.0.0
  # OpenAPI -> Swift types, generated at build time from
  # StravaClone/Core/Network/OpenAPI/openapi.json (ADR-026).
  OpenAPIGenerator:
    url: https://github.com/apple/swift-openapi-generator
    from: 1.10.0
  OpenAPIRuntime:
    url: https://github.com/apple/swift-openapi-runtime
    from: 1.8.0
  OpenAPIURLSession:
    url: https://github.com/apple/swift-openapi-urlsession
    from: 1.1.0

targets:
  StravaClone:
    type: application
    platform: iOS
    sources:
      - path: StravaClone
        excludes:
          - "**/.gitkeep"
    info:
      path: StravaClone/Info.plist
      properties:
        CFBundleDisplayName: StravaClone
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [location]
        NSLocationWhenInUseUsageDescription: "StravaClone utilise votre position pour l'afficher sur la carte et enregistrer le tracé de vos activités, y compris écran verrouillé."
        # Values injected from Config/Base.xcconfig (+ optional Secrets.xcconfig), read by AppConfiguration (App/Di.swift).
        APIBaseURL: $(API_BASE_URL)
        RealtimeURL: $(REALTIME_URL)
        MBXAccessToken: $(MAPBOX_ACCESS_TOKEN)
        # Mapbox Directions token dedicated to Itineraries (ADR-030 §2), distinct from the map's.
        MapboxItinerariesToken: $(MAPBOX_ITINERARIES_TOKEN)
        RevenueCatAPIKey: $(REVENUECAT_API_KEY)
        PostHogAPIKey: $(POSTHOG_API_KEY)
        # Google Sign-In (ADR-022): GIDClientID is read by GIDSignIn at launch;
        # CFBundleURLTypes lets iOS route the OAuth callback back into the app.
        GIDClientID: $(GOOGLE_IOS_CLIENT_ID)
        # Audience of the returned ID token: the backend's web client, verified by Better Auth.
        GIDServerClientID: $(GOOGLE_SERVER_CLIENT_ID)
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - $(GOOGLE_IOS_URL_SCHEME)
        # Activity files accepted by the import (ADR-028): lets the Files picker filter them.
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.topografix.gpx
            UTTypeDescription: GPS Exchange Format
            UTTypeConformsTo: [public.xml]
            UTTypeTagSpecification:
              public.filename-extension: [gpx]
              public.mime-type: [application/gpx+xml]
          - UTTypeIdentifier: com.garmin.tcx
            UTTypeDescription: Training Center XML
            UTTypeConformsTo: [public.xml]
            UTTypeTagSpecification:
              public.filename-extension: [tcx]
              public.mime-type: [application/vnd.garmin.tcx+xml]
          - UTTypeIdentifier: com.garmin.fit
            UTTypeDescription: Flexible and Interoperable Data Transfer
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [fit]
              public.mime-type: [application/vnd.ant.fit]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.echimine.stravaclone
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - package: GRDB
      - package: RevenueCat
      - package: PostHog
      # Import MapboxMaps only in Features/*/Presentation and Core/DesignSystem/Map (ADR-007 rule 6, ADR-027).
      - package: MapboxMaps
      - package: GoogleSignIn
      - package: OpenAPIRuntime
      - package: OpenAPIURLSession
    buildToolPlugins:
      - plugin: OpenAPIGenerator
        package: OpenAPIGenerator
    scheme:
      testTargets:
        - StravaCloneTests
        - StravaCloneUITests
      gatherCoverageData: true

  StravaCloneTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: StravaCloneTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: fr.echimine.stravaclone.tests
    dependencies:
      - target: StravaClone

  StravaCloneUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: StravaCloneUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: fr.echimine.stravaclone.uitests
    dependencies:
      - target: StravaClone
