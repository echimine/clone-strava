<meta charset="utf-8">
<title>Éditeur d'Itinéraire</title>
<!--
  PROTOTYPE jetable : ticket wayfinder « Interaction de l'éditeur d'Itinéraire sur iOS » (#7, carte #5).
  Trois variantes d'interaction de l'éditeur, switchables via #A / #B / #C (barre en bas ou flèches ← →).
  Le tracé suit les routes et sentiers (plus court chemin sur le réseau fictif ; le vrai éditeur appellera Mapbox Directions).
  Les Waypoints s'aimantent au chemin le plus proche (< 200 m) quand on les lâche. Carte et dénivelé fictifs, rien n'est persisté. Ne pas porter tel quel en Swift.
-->
<style>

  --line: rgba(255, 255, 255, .13); --glass: rgba(29, 28, 27, .88);
  --land: #22211F; --park: #24321F; --water: #1D3449; --road: #3B3936; --casing: #2B2927; --trail: #B59B79; --label: #B9B1A9;

  --line: rgba(255, 255, 255, .13); --glass: rgba(29, 28, 27, .88);
  --land: #22211F; --park: #24321F; --water: #1D3449; --road: #3B3936; --casing: #2B2927; --trail: #B59B79; --label: #B9B1A9;

/* Variant C: long press + menus */

.c-top > * { pointer-events: auto; }
.chipstats { flex: 1; min-width: 0; border: 0; background: var(--glass); border-radius: 999px; height: 40px; padding: 0 14px; box-shadow: 0 1px 4px rgba(0, 0, 0, .18); font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 6px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }

.drawer { position: absolute; top: 60px; left: 12px; right: 12px; background: var(--surface); border-radius: 16px; padding: 10px 12px; box-shadow: 0 4px 16px rgba(0, 0, 0, .16); display: grid; gap: 6px; }

.asheet button.danger { color: var(--danger); }

/* toast + modal (shared) */

@media (prefers-reduced-motion: reduce) { .b-sheet { transition: none; } }
</style>

<div class="stage">
  <div class="phone" id="phone">
    <canvas id="map" aria-label="Carte de l'éditeur d'Itinéraire"></canvas>

<script>
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const phone = $('#phone'), canvas = $('#map'), ctx = canvas.getContext('2d'), chrome = $('#chrome');

/* ---------- fictional terrain & map (world in metres, 6 × 6 km) ---------- */
const W = 6000;
const hills = [{ x: 3900, y: 1300, h: 170, s: 650 }, { x: 1100, y: 4300, h: 120, s: 520 }, { x: 5000, y: 4600, h: 90, s: 800 }, { x: 1900, y: 900, h: 70, s: 450 }];
const riverY = x => 3300 + 260 * Math.sin(x / 900 + 1);
function elev(x, y) {
  let e = 140;
  for (const h of hills) e += h.h * Math.exp(-((x - h.x) ** 2 + (y - h.y) ** 2) / (2 * h.s * h.s));
  const dr = y - riverY(x);
  e -= 35 * Math.exp(-(dr * dr) / (2 * 300 * 300));
  return e + 6 * Math.sin(x / 170) * Math.cos(y / 210);
}
const RES = 300, CELL = W / RES, shade = document.createElement('canvas');
shade.width = shade.height = RES;
(() => {
  const sc = shade.getContext('2d'), img = sc.createImageData(RES, RES);
  for (let j = 0; j < RES; j++) for (let i = 0; i < RES; i++) {
    const x = (i + .5) * CELL, y = (j + .5) * CELL, e = elev(x, y);
    const lum = -((elev(x + CELL, y) - elev(x - CELL, y)) + (elev(x, y + CELL) - elev(x, y - CELL))) / (2 * CELL) * 3;
    let r = lum > 0 ? 255 : 0, g = r, b = r, a = Math.min(.32, Math.abs(lum));
    const band = Math.floor(e / 20);
    if (band !== Math.floor(elev(x + CELL, y) / 20) || band !== Math.floor(elev(x, y + CELL) / 20)) { r = 140; g = 100; b = 60; a = .28; }
    const k = (j * RES + i) * 4; img.data[k] = r; img.data[k + 1] = g; img.data[k + 2] = b; img.data[k + 3] = a * 255;
  }
  sc.putImageData(img, 0, 0);
})();
const forests = [{ x: 3900, y: 1250, rx: 620, ry: 460 }, { x: 1150, y: 4300, rx: 460, ry: 380 }, { x: 4750, y: 3950, rx: 300, ry: 520 }];
const seq = (f, a, b, st) => { const p = []; for (let t = a; t <= b + 1e-9; t += st) p.push(f(t)); return p; };
const roads = [
  { name: 'D 912', kind: 'main', pts: seq(x => [x, 2600 + 180 * Math.sin(x / 700)], 0, W, 80) },
  { name: 'Route des Combes', kind: 'main', pts: seq(y => [2400 + 220 * Math.sin(y / 800), y], 0, W, 80) },
  { name: 'Route du Plateau', kind: 'road', pts: seq(t => [2900 + 2300 * t, 2450 - 1500 * t + 250 * Math.sin(t * Math.PI * 2)], 0, 1, .02) },
  { name: 'Chemin des Vignes', kind: 'trail', pts: seq(t => [3590 + 210 * t + 40 * Math.sin(t * 5), 2238 - 526 * t], 0, 1, .05) },
  { name: "Rue de l'Église", kind: 'street', pts: [[2150, 2420], [2700, 2440]] },
  { name: 'Rue Haute', kind: 'street', pts: [[2100, 2300], [2650, 2290]] },
  { name: 'Rue Basse', kind: 'street', pts: [[2150, 2760], [2750, 2740]] },
  { name: 'Rue du Moulin', kind: 'street', pts: [[2200, 2880], [2700, 3000]] },
  { name: 'Rue des Écoles', kind: 'street', pts: [[2150, 2250], [2150, 2900]] },
  { name: 'Allée des Tilleuls', kind: 'street', pts: [[2620, 2280], [2640, 2850]] },
  { name: 'Chemin du Lavoir', kind: 'street', pts: [[2700, 2740], [2850, 3150]] },
  { name: 'Sentier des Crêtes', kind: 'trail', pts: seq(a => [3900 + 520 * Math.cos(a), 1300 + 420 * Math.sin(a)], 0, Math.PI * 2 + .1, .1) },
  { name: 'Chemin de la Garenne', kind: 'trail', pts: seq(t => [2350 - 1200 * t + 150 * Math.sin(t * 6), 2900 + 1400 * t], 0, 1, .02) },
  { name: 'Chemin de halage', kind: 'trail', pts: seq(x => [x, riverY(x) - 70], 0, W, 80) },
];
const places = [{ t: 'Saint-Aubin', x: 2420, y: 2510, big: true }, { t: 'Bois des Crêtes', x: 3900, y: 1300 }, { t: 'Bois de la Garenne', x: 1150, y: 4300 }, { t: 'La Vionne', x: 4300, y: 3330 }];

function segDist(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay, L = dx * dx + dy * dy;
  const t = L ? Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / L)) : 0;
  return Math.hypot(px - ax - t * dx, py - ay - t * dy);
}
function nearestRoad(x, y) {
  let best = null, bd = 1e9;
  for (const r of roads) for (let i = 0; i < r.pts.length - 1; i++) {
    const d = segDist(x, y, ...r.pts[i], ...r.pts[i + 1]);
    if (d < bd) { bd = d; best = r.name; }
  }
  return bd < 120 ? best : 'Hors chemin';
}

/* ---------- fake router: shortest path on the drawn network ---------- */
const N = [], E = [];
const link = (i, j) => { const w = Math.hypot(N[i][0] - N[j][0], N[i][1] - N[j][1]); E[i].push([j, w]); E[j].push([i, w]); };
for (const r of roads) {
  let prev = -1;
  for (let i = 0; i < r.pts.length - 1; i++) {
    const [ax, ay] = r.pts[i], [bx, by] = r.pts[i + 1], n = Math.max(1, Math.ceil(Math.hypot(bx - ax, by - ay) / 30));
    for (let k = i === 0 ? 0 : 1; k <= n; k++) { N.push([ax + (bx - ax) * k / n, ay + (by - ay) * k / n]); E.push([]); if (prev >= 0) link(prev, N.length - 1); prev = N.length - 1; }
  }
}
for (let i = 0; i < N.length; i++) for (let j = i + 1; j < N.length; j++)
  if (Math.hypot(N[i][0] - N[j][0], N[i][1] - N[j][1]) < 45 && !E[i].some(([k]) => k === j)) link(i, j);
function nearestNode(x, y) { let b = 0, bd = Infinity; for (let i = 0; i < N.length; i++) { const d = (N[i][0] - x) ** 2 + (N[i][1] - y) ** 2; if (d < bd) { bd = d; b = i; } } return b; }
const pathCache = new Map();
function shortest(s, t) {
  const key = s + '-' + t; if (pathCache.has(key)) return pathCache.get(key);
  const dist = new Float64Array(N.length).fill(Infinity), prev = new Int32Array(N.length).fill(-1), h = [[0, s]];
  const push = it => { h.push(it); let i = h.length - 1; while (i) { const p = (i - 1) >> 1; if (h[p][0] <= h[i][0]) break; [h[p], h[i]] = [h[i], h[p]]; i = p; } };
  const pop = () => { const top = h[0], last = h.pop(); if (h.length) { h[0] = last; let i = 0; for (;;) { const l = 2 * i + 1, r = l + 1; let m = i; if (l < h.length && h[l][0] < h[m][0]) m = l; if (r < h.length && h[r][0] < h[m][0]) m = r; if (m === i) break; [h[m], h[i]] = [h[i], h[m]]; i = m; } } return top; };
  dist[s] = 0;
  while (h.length) {
    const [d, u] = pop(); if (d > dist[u]) continue; if (u === t) break;
    for (const [v, w] of E[u]) if (d + w < dist[v]) { dist[v] = d + w; prev[v] = u; push([d + w, v]); }
  }
  let path = null;
  if (dist[t] < Infinity) { path = []; for (let u = t; u !== -1; u = prev[u]) path.push(u); path.reverse(); }
  if (pathCache.size > 4000) pathCache.clear();

          <div class="b-head"><div class="big"><b class="num" id="s-d"></b><span>km</span></div><div class="big"><b class="num" id="s-g"></b><span>m D+</span></div><button type="button" class="round" data-act="undo" id="b-undo" aria-label="Annuler">↶</button></div>
          <canvas class="profile" height="44"></canvas>
          <ol class="wlist" id="wlist"></ol></div>`;
      this.sizeSheet();
    },
    sizeSheet() { const s = $('#sheet'); if (s) s.style.height = this.sheetLow ? '132px' : '46%'; setTimeout(dirty, 260); },
    crossPoint() {
      const s = $('#sheet'); const bottom = s ? s.offsetTop : vh;
      return { x: vw / 2, y: (52 + bottom) / 2 };
    },
    update(st) {
      $('#s-d').textContent = km(st.d); $('#s-g').textContent = mm(st.gain);
      $('#b-undo').disabled = !S.past.length; $('#b-save').disabled = S.wps.length < 2;
      drawProfile($('.profile', chrome), st);
      const ol = $('#wlist');
      if (!S.wps.length) { ol.innerHTML = '<li class="empty">Centrez le réticule sur votre départ puis touchez « Placer le départ ».</li>'; return; }
      ol.innerHTML = S.wps.map((w, i) => `<li class="${S.sel === i ? 'sel' : ''}">
        <button type="button" class="rowbtn" data-act="row" data-i="${i}"><span class="dot ${role(i)}"></span>
        <span class="txt"><b>${roleLabel(i)}</b><span>${nearestRoad(w.x, w.y)}${i ? ' · à ' + km(st.cum[i]) + ' km' : ''}</span></span></button>
        <button type="button" class="del" data-act="rowDel" data-i="${i}" aria-label="Supprimer ${roleLabel(i)}">Supprimer</button></li>`).join('');
    },
    position() {
      const c = this.crossPoint(), cross = $('#cross'), fab = $('#fab'); if (!cross) return;
      cross.style.left = c.x + 'px'; cross.style.top = c.y + 'px';
      const seg = S.wps.length > 1 ? hitSegment(c, 18) : -1;
      cross.classList.toggle('near', seg >= 0); this.nearSeg = seg;
      const s = $('#sheet'); fab.style.top = ((s ? s.offsetTop : vh) - 62) + 'px';
      fab.textContent = '＋ ' + (S.wps.length === 0 ? 'Placer le départ' : S.wps.length === 1 ? "Placer l'arrivée" : seg >= 0 ? 'Insérer ici' : 'Ajouter ici');
    },
    onTapMarker(i) { S.sel = i; S.last = 'tap sur ' + roleLabel(i) + ' (maintenir pour déplacer)'; toast('Maintenez le Waypoint pour le déplacer'); changed(); },
    onTapEmpty() { if (S.sel !== null) { S.sel = null; changed(); } },
  },

  C: {
    name: 'Appui long',
    markerDrag: 'immediate', holdMs: 450, lineInsert: true, markerText: i => String.fromCharCode(64 + i),
    drawerOpen: false,
    mount() {
      chrome.innerHTML = `
        <div class="c-top"><button type="button" class="round" data-act="close" aria-label="Fermer">✕</button>
          <button type="button" class="chipstats" data-act="statsToggle" id="chip" aria-expanded="false"></button>
          <button type="button" class="pillbtn" data-act="save" id="c-save">Terminé</button></div>
        <div class="drawer ui" id="drawer" hidden><canvas class="profile" height="84"></canvas><div class="row" id="drawer-row"></div></div>
        <div class="hint" id="hint"></div>
        <div class="tools ui"><button type="button" data-act="loop">⟲ Boucler</button><button type="button" data-act="reverse">⇄ Inverser</button></div>
        <div class="ctxmenu ui" id="ctx" hidden></div>
        <div class="asheet ui" id="as" hidden></div>`;
    },
    update(st) {
      $('#chip').innerHTML = S.wps.length < 2 ? '<span>Aucun tracé</span>' : `<span class="num">${km(st.d)} km</span> · <span class="num">↗ ${mm(st.gain)} m</span> <span aria-hidden="true">▾</span>`;
      $('#c-save').disabled = S.wps.length < 2;
      $('#hint').textContent = S.wps.length === 0 ? 'Maintenez le doigt sur la carte pour placer le départ' : S.wps.length === 1 ? "Maintenez le doigt pour placer l'arrivée" : '';
      $('#drawer').hidden = !this.drawerOpen;
      if (this.drawerOpen) { drawProfile($('.profile', chrome), st); $('#drawer-row').innerHTML = `<span>↗ ${mm(st.gain)} m · ↘ ${mm(st.loss)} m</span><span>${S.wps.length} Waypoints</span>`; }
    },
    onEdit(label) { if (label) toast(label.charAt(0).toUpperCase() + label.slice(1), 'Annuler', undo); },
    dismiss() { const had = !$('#ctx').hidden || !$('#as').hidden; $('#ctx').hidden = $('#as').hidden = true; S.pin = null; if (had) dirty(); },
    onHoldEmpty(p) {
      const [x, y] = toW(p.x, p.y); S.pin = { x, y }; S.last = 'appui long : menu'; dirty();
      const n = S.wps.length, opts = n === 0 ? [['start', 'Placer le départ ici']] : n === 1 ? [['end', "Placer l'arrivée ici"]]
        : [['via', 'Ajouter une étape (au meilleur endroit)'], ['end', 'Nouvelle arrivée ici'], ['start', 'Nouveau départ ici']];
      const m = $('#ctx');
      m.innerHTML = opts.map(([k, t]) => `<button type="button" data-act="ctx" data-k="${k}">${t}</button>`).join('');
      m.hidden = false;
      m.style.left = Math.min(Math.max(8, p.x - 115), vw - 246) + 'px'; m.style.top = Math.min(p.y + 14, vh - m.offsetHeight - 8) + 'px';
      updatePanel();
    },
    onTapMarker(i) {
      S.sel = i; dirty();
      const as = $('#as');
      as.innerHTML = `<div class="grp"><div class="ttl">${roleLabel(i)} · ${nearestRoad(S.wps[i].x, S.wps[i].y)}</div>
        <button type="button" class="danger" data-act="del">Supprimer ce Waypoint</button></div>
        <div class="grp"><button type="button" class="cancel" data-act="asCancel">Annuler</button></div>`;
      as.hidden = false; updatePanel();
    },
    onTapEmpty() { if (S.sel !== null) { S.sel = null; dirty(); } },
  },
};
Object.assign(ACT, {
  fab() {
    const c = VARIANTS.B.crossPoint(), [x, y] = toW(c.x, c.y), seg = VARIANTS.B.nearSeg;
    if (S.wps.length > 1 && seg >= 0) edit('réticule : insérer sur le tracé', () => S.wps.splice(seg + 1, 0, wp(x, y)));
    else edit('réticule : ajouter à la fin', () => S.wps.push(wp(x, y)));
  },
  sheetToggle() { VARIANTS.B.sheetLow = !VARIANTS.B.sheetLow; VARIANTS.B.sizeSheet(); },
  row(b) { const i = +b.dataset.i; S.sel = i; cam.x = S.wps[i].x; cam.y = S.wps[i].y + (VARIANTS.B.sheetLow ? 0 : vh * .2) / cam.z; S.last = 'liste : centrer sur ' + roleLabel(i); changed(); },
  rowDel(b) { const i = +b.dataset.i; edit('liste : supprimer ' + roleLabel(i), () => S.wps.splice(i, 1)); S.sel = null; changed(); },
  statsToggle() { const v = VARIANTS.C; v.drawerOpen = !v.drawerOpen; $('#chip').setAttribute('aria-expanded', v.drawerOpen); changed(); },
  ctx(b) {
    const { x, y } = S.pin, k = b.dataset.k; VARIANTS.C.dismiss();
    if (k === 'start') edit(S.wps.length ? 'nouveau départ' : 'départ placé', () => S.wps.unshift(wp(x, y)));
    else if (k === 'end') edit(S.wps.length > 1 ? 'nouvelle arrivée' : 'arrivée placée', () => S.wps.push(wp(x, y)));
    else edit('étape ajoutée', () => S.wps.splice(bestInsertIndex(x, y), 0, wp(x, y)));
  },
  asCancel() { $('#as').hidden = true; S.sel = null; dirty(); },
  loop() { if (S.wps.length < 2) return; edit('boucle : retour au départ', () => S.wps.push(wp(S.wps[0].x, S.wps[0].y))); },
  reverse() { if (S.wps.length < 2) return; edit('sens inversé', () => S.wps.reverse()); },
});
const _del = ACT.del; ACT.del = () => { _del(); if (V.key === 'C') $('#as').hidden = true; };

/* ---------- glue: state → chrome, panel, switcher ---------- */
let V = VARIANTS.A;
function changed(label) { S.legs = []; for (let i = 0; i < S.wps.length - 1; i++) S.legs.push(routeLeg(S.wps[i], S.wps[i + 1])); ST = stats(); V.update(ST); if (label) V.onEdit?.(label); updatePanel(); dirty(); }
function updatePanel() {
  const p = $('#statepanel'); if (p.hidden) return;
  $('#sp-pre').textContent = JSON.stringify({
    variante: V.key + ' · ' + V.name, dernier_geste: S.last,
    waypoints: S.wps.map((w, i) => `${roleLabel(i).padEnd(8)} x=${Math.round(w.x)} y=${Math.round(w.y)} alt=${Math.round(elev(w.x, w.y))} m`),
    distance_km: +(ST.d / 1000).toFixed(2), denivele_plus_m: Math.round(ST.gain), denivele_moins_m: Math.round(ST.loss),
    pile_annuler: S.past.length, pile_retablir: S.future.length,
    selection: S.sel === null ? null : roleLabel(S.sel), zoom_px_par_m: +cam.z.toFixed(3), enregistre: S.saved,
  }, null, 2);
}
const KEYS = Object.keys(VARIANTS);
function mount(key) {
  V = VARIANTS[key] || VARIANTS.A; V.key = KEYS.includes(key) ? key : 'A';
  S.sel = null; S.pin = null; S.lifted = null; $('#modal').hidden = true; $('#toast').hidden = true;
  V.mount(); $('#sw-cur').textContent = V.key + ' · ' + V.name;
  changed();
}
function go(step) { const i = (KEYS.indexOf(V.key) + step + KEYS.length) % KEYS.length; location.hash = KEYS[i]; }
$('#sw-prev').onclick = () => go(-1);
$('#sw-next').onclick = () => go(1);
$('#sw-state').onclick = e => { const p = $('#statepanel'); p.hidden = !p.hidden; e.currentTarget.setAttribute('aria-pressed', !p.hidden); updatePanel(); };
function reset(list, label) { S.wps = list; S.past = []; S.future = []; S.sel = null; S.last = label; changed(); }
$('#sp-ex').onclick = () => reset(EXAMPLE(), 'exemple rechargé');
$('#sp-clear').onclick = () => reset([], 'vidé');
addEventListener('hashchange', () => mount(location.hash.slice(1)));
addEventListener('keydown', e => {
  if (e.target.closest('input, textarea, [contenteditable]')) return;
  if (e.key === 'ArrowLeft') go(-1);
  else if (e.key === 'ArrowRight') go(1);
  else if ((e.metaKey || e.ctrlKey) && e.key === 'z') { e.shiftKey ? redo() : undo(); }
});
new ResizeObserver(() => { dirty(); }).observe(canvas);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', readTokens);
new MutationObserver(readTokens).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
readTokens();
mount(location.hash.slice(1) || 'A');
</script>
