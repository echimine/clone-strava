<!--
  PROTOTYPE jetable : ticket wayfinder « Écrans liste et détail des Itinéraires » (#18, carte #5).
  Trois variantes, switchables via #A / #B / #C (barre en bas ou flèches ← →) :
    A. Dans l'onglet Map : carte plein écran + carrousel, détail en panneau sur la carte.
    B. Depuis le Profil : cartes façon flux (ADR-029), détail en page qui défile.
    C. Onglet Map > « Mes Itinéraires » : lignes compactes, tri, recherche, balayage ; détail carte plein écran avec profil interactif.
    D. (retour sur A) Onglet Map : bottom sheet à 30 % avec la liste, défiler l'ouvre en entier ;
       toucher un Itinéraire referme la sheet sur une petite carte (nom, stats, actions) au-dessus de la tab bar.

<div class="c-card">${S.editing ? `<input class="c-titlein" id="titlein" value="${esc(it.name)}" maxlength="100" aria-label="Nom de l'Itinéraire">` : `<button class="c-title" data-act="inline">${esc(it.name)}</button>`}
<div class="small muted">${SPORTS[it.sport]} · ${when(it.updatedAt)}</div>${statsHTML(it)}${profileHTML(it, true)}<div class="src">${SRC[it.elevationSource]}${S.profile ? ' · glissez sur le profil' : ''}</div></div>${toastHTML()}`;
  }
  tabbar('Map');
  return `<div class="scroll" id="cscroll"><div class="seg top"><button>Explorer</button><button class="on">Mes Itinéraires</button></div>
<div class="nav" style="height:36px"><span></span><span></span><span class="r"><button class="link" data-act="create" aria-label="Créer un Itinéraire">＋ Créer</button></span></div>
${S.empty ? '' : `<input class="search" id="search" type="search" placeholder="Rechercher" value="${esc(S.q)}" aria-label="Rechercher un Itinéraire">
<div class="seg">${Object.entries(SORTS).map(([k, t]) => `<button class="${S.sort === k ? 'on' : ''}" data-act="sort" data-k="${k}">${t}</button>`).join('')}</div>`}
<div id="crows">${rowsHTML()}</div></div>${toastHTML()}`;
}

// ---------- overlays ----------
function overlayHTML() {
  const sh = S.sheet; if (!sh) return '';
  const it = items.find(x => x.id === sh.id);
  if (sh.type === 'more') return `<div class="ov"><div class="scrim" data-act="close"></div><div class="asheet"><div class="grp"><div class="ttl">${esc(it.name)}</div>
<button data-act="rename" data-id="${it.id}">Renommer</button><button data-act="edit">Modifier le tracé</button>${S.variant === 'B' ? '' : `<button class="danger" data-act="${S.variant === 'C' ? 'cdelete' : 'delete'}" data-id="${it.id}">Supprimer</button>`}</div>
<div class="grp"><button class="cancel" data-act="close">Annuler</button></div></div></div>`;
  if (sh.type === 'confirm') return `<div class="ov"><div class="scrim" data-act="close"></div><div class="asheet"><div class="grp"><div class="ttl">Supprimer « ${esc(it.name)} » ? Cette action est définitive.</div>
<button class="danger" data-act="confirmdelete">Supprimer l'Itinéraire</button></div><div class="grp"><button class="cancel" data-act="close">Annuler</button></div></div></div>`;
  if (sh.type === 'sort') return `<div class="ov"><div class="scrim" data-act="close"></div><div class="asheet"><div class="grp"><div class="ttl">Trier les Itinéraires</div>
${Object.entries({ recent: 'Modifiés récemment', name: 'Nom (A → Z)', dist: 'Distance (la plus longue)', dplus: 'Dénivelé + (le plus fort)' }).map(([k, t]) => `<button class="${S.sort === k ? 'on' : ''}" data-act="sort" data-k="${k}">${t}${S.sort === k ? ' ✓' : ''}</button>`).join('')}</div>
<div class="grp"><button class="cancel" data-act="close">Annuler</button></div></div></div>`;
  if (sh.type === 'rename') return `<div class="ov"><div class="scrim" data-act="close"></div><form class="alert" id="renameform"><h4>Renommer l'Itinéraire</h4><p>De 1 à 100 caractères.</p>
<input id="renamein" value="${esc(it.name)}" maxlength="100" aria-label="Nom"><div class="err" id="renameerr"></div>
<div class="btns"><button type="button" data-act="close">Annuler</button><button type="submit">Enregistrer</button></div></form></div>`;
  return '';
}

// ---------- render ----------
function render() {
  const scr = document.getElementById('screen');
  scr.innerHTML = ({ A: renderA, B: renderB, C: renderC, D: renderD })[S.variant]();
  const sh = document.getElementById('dsheet');
  if (sh && dFrom != null) { const to = sh.style.height; sh.classList.add('drag'); sh.style.height = dFrom + 'px'; sh.offsetHeight; sh.classList.remove('drag'); sh.style.height = to; }
  dFrom = null;
  document.getElementById('overlay').innerHTML = overlayHTML();
  document.getElementById('cur').textContent = `${S.variant} (${VARIANTS[S.variant]})`;
  document.getElementById('t-empty').classList.toggle('on', S.empty);
  document.getElementById('t-prof').classList.toggle('on', S.profile);
  const ri = document.getElementById('renamein'); if (ri) { ri.focus(); ri.select(); }
  const ti = document.getElementById('titlein'); if (ti) { ti.focus(); ti.select(); }
  if (S.variant === 'A' && S.screen === 'list') { const c = document.querySelector('.ccard.sel'); c?.scrollIntoView({ inline: 'center', block: 'nearest' }); }
  renderState();
}
function renderState() {
  const it = cur();
  document.getElementById('statepre').textContent = JSON.stringify({
    variant: S.variant, screen: S.variant === 'D' ? 'sheet:' + S.dsheet : S.screen, selected: it ? it.name : null, sort: S.variant === 'A' ? 'recent (fixe)' : S.sort, search: S.q || undefined,
    empty: S.empty, elevationProfile: S.profile, pendingDelete: S.pending?.it.name, visible: visible().length,
  }, null, 2) + '\n\nRequêtes (simulées) :\n' + (S.log.join('\n') || '—');
}

// ---------- actions ----------
function setToast(text, undo) { clearTimeout(S.toastT); S.toast = { text, undo }; S.toastT = setTimeout(() => { if (undo) finalizeDelete(); S.toast = null; render(); }, undo ? 5000 : 2600); }
function finalizeDelete() { if (!S.pending) return; const { it } = S.pending; items = items.filter(x => x.id !== it.id); log(`DELETE /v1/itineraries/${it.id} → 204 (envoyé après 5 s sans « Annuler »)`); S.pending = null; }
function openDetail(id) {
  S.sel = id; S.screen = 'detail'; S.editing = false; S.openRow = null;
  log(`GET /v1/itineraries/${id}` + (S.profile ? '  + track à ~20 m (absent du contrat actuel)' : ''));
}
function rename(id, name) {
  const it = items.find(x => x.id === id), v = name.trim().replace(/\s+/g, ' ');
  if (!v || v.length > 100) return false;
  if (v !== it.name) { it.name = v; it.updatedAt = Date.now(); log(`PATCH /v1/itineraries/${id} { name } (absent du contrat : PUT complet aujourd'hui) → updated_at change, remonte en tête du tri « Récents »`); setToast('Itinéraire renommé'); }
  return true;
}
const ACT = {
  back() { S.screen = S.variant === 'B' && S.screen === 'list' ? 'profile' : 'list'; S.editing = false; aVB = null; },
  tolist() { S.screen = 'list'; log('GET /v1/itineraries?cursor= (curseur, tri updated_at desc)'); },
  open(el) { openDetail(el.dataset.id); },
  pick(el) { if (S.sel === el.dataset.id) return openDetail(el.dataset.id); S.sel = el.dataset.id; render(); animateA(); return 'skip'; },
  create() { setToast("→ ouvre l'éditeur (« Interaction de l'éditeur », #7)"); },
  edit() { S.sheet = null; setToast("→ rouvre l'éditeur avec Waypoints et tronçons stockés"); },
  more() { S.sheet = { type: 'more', id: S.sel }; },
  close() { S.sheet = null; },
  rename(el) { S.sheet = { type: 'rename', id: el.dataset.id }; S.openRow = null; },
  delete(el) { S.sheet = { type: 'confirm', id: el.dataset.id || S.sel }; },
  confirmdelete() { const id = S.sheet.id; items = items.filter(x => x.id !== id); log(`DELETE /v1/itineraries/${id} → 204`); S.sheet = null; S.screen = 'list'; S.dsheet = 'peek'; aVB = null; setToast('Itinéraire supprimé'); },
  cdelete(el) {
    if (S.pending) finalizeDelete();
    const it = items.find(x => x.id === el.dataset.id); S.pending = { it }; S.sheet = null; S.openRow = null; S.screen = 'list';
    setToast('Itinéraire supprimé', true);
  },
  undo() { S.pending = null; clearTimeout(S.toastT); S.toast = null; log('Suppression annulée : aucune requête envoyée'); },
  sortsheet() { S.sheet = { type: 'sort' }; },
  sort(el) { S.sort = el.dataset.k; S.sheet = null; log(`GET /v1/itineraries?sort=${S.sort} (le contrat ne trie que par updated_at desc)`); },
  inline() { S.editing = true; },
  dpick(el) { S.sel = el.dataset.id; log(`GET /v1/itineraries/${S.sel}` + (S.profile ? '  + track à ~20 m (absent du contrat actuel)' : '')); setDetent('sel'); return 'skip'; },
  dclose() { setDetent('peek'); return 'skip'; },
  dtoggle() { setDetent({ peek: 'full', full: 'peek', sel: 'seldetail', seldetail: 'sel' }[S.dsheet]); return 'skip'; },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || !document.getElementById('phone').contains(el)) return;
  if (performance.now() < suppressUntil) return;
  const r = ACT[el.dataset.act]?.(el); if (r !== 'skip') render();
});
document.addEventListener('submit', e => {
  if (e.target.id !== 'renameform') return; e.preventDefault();
  if (rename(S.sheet.id, document.getElementById('renamein').value)) { S.sheet = null; render(); }
  else document.getElementById('renameerr').textContent = 'Le nom doit contenir de 1 à 100 caractères.';
});
// C: inline title editing
document.addEventListener('keydown', e => {
  if (e.target.id === 'titlein') { if (e.key === 'Enter') e.target.blur(); if (e.key === 'Escape') { S.editing = false; render(); } }
});
document.addEventListener('focusout', e => {
  if (e.target.id !== 'titlein' || !S.editing) return;
  S.editing = false; if (!rename(S.sel, e.target.value)) setToast('Nom vide : non enregistré'); render();
});
// C: search without losing focus
document.addEventListener('input', e => { if (e.target.id === 'search') { S.q = e.target.value; document.getElementById('crows').innerHTML = rowsHTML(); renderState(); } });
// C: swipe rows + tap to open
let drag = null;
document.addEventListener('pointerdown', e => {
  const fg = e.target.closest('.fg'); if (!fg) { if (S.openRow && !e.target.closest('.acts')) { S.openRow = null; document.querySelectorAll('.fg').forEach(f => f.style.transform = 'translateX(0)'); } return; }
  drag = { fg, id: fg.dataset.row, x: e.clientX, base: S.openRow === fg.dataset.row ? -168 : 0, moved: false };
});
document.addEventListener('pointermove', e => {
  if (!drag) return; const dx = e.clientX - drag.x; if (Math.abs(dx) > 6) drag.moved = true;
  if (drag.moved) { drag.fg.classList.add('drag'); drag.fg.style.transform = `translateX(${Math.min(0, Math.max(-200, drag.base + dx))}px)`; }
});
document.addEventListener('pointerup', e => {
  if (!drag) return; const d = drag; drag = null; d.fg.classList.remove('drag');
  if (!d.moved) { if (S.openRow) { S.openRow = null; render(); return; } openDetail(d.id); render(); return; }
  S.openRow = d.base + e.clientX - d.x < -70 ? d.id : null;
  document.querySelectorAll('.fg').forEach(f => f.style.transform = `translateX(${f.dataset.row === S.openRow ? -168 : 0}px)`);
});
// C: scrub the elevation profile → marker on the map
function scrubAt(prof, clientX) {
  const it = cur(), svg = prof.querySelector('svg').getBoundingClientRect(), f = Math.min(1, Math.max(0, (clientX - svg.left) / svg.width));
  const T = it.cum[it.cum.length - 1]; let k = it.cum.findIndex(c => c >= f * T); if (k < 0) k = it.cum.length - 1;
  const x = svg.left - prof.getBoundingClientRect().left + f * svg.width;
  prof.classList.add('scrub'); prof.querySelector('.cur').style.left = x + 'px';
  const rd = prof.querySelector('.read'); rd.style.left = Math.min(Math.max(x, 50), prof.clientWidth - 50) + 'px'; rd.textContent = `${km(it.cum[k])} · ${nf0.format(it.alt[k])} m`;
  const dot = document.getElementById('scrubdot'); if (dot) { dot.setAttribute('cx', it.pts[k][0]); dot.setAttribute('cy', it.pts[k][1]); dot.setAttribute('visibility', 'visible'); }
}
document.addEventListener('pointerdown', e => { const p = e.target.closest('[data-scrub]'); if (p) { p.setPointerCapture(e.pointerId); p.dataset.on = '1'; scrubAt(p, e.clientX); } });
document.addEventListener('pointermove', e => { const p = e.target.closest('[data-scrub]'); if (p?.dataset.on) scrubAt(p, e.clientX); });
document.addEventListener('pointerup', e => { const p = e.target.closest('[data-scrub]'); if (p) { delete p.dataset.on; p.classList.remove('scrub'); document.getElementById('scrubdot')?.setAttribute('visibility', 'hidden'); } });

// D: drag the sheet between detents; scrolling inside the 30 % sheet opens it fully
let dd = null;
document.addEventListener('pointerdown', e => {
  const sh = document.getElementById('dsheet'); if (S.variant !== 'D' || !sh?.contains(e.target)) return;
  const expanded = S.dsheet === 'full' || S.dsheet === 'seldetail', onGrab = !!e.target.closest('.d-grab');
  if (!onGrab && expanded && document.getElementById('dbody').scrollTop > 0) return;
  dd = { y: e.clientY, h0: sh.offsetHeight, moved: false, onGrab, expanded };
});
document.addEventListener('pointermove', e => {
  if (!dd) return; const dy = e.clientY - dd.y, sh = document.getElementById('dsheet');
  if (!dd.moved && Math.abs(dy) < 8) return;
  if (!dd.moved && !dd.onGrab && dd.expanded && dy < 0) { dd = null; return; } // let the list scroll
  dd.moved = true; sh.classList.add('drag'); sh.style.height = Math.min(dHeights().full, Math.max(120, dd.h0 - dy)) + 'px';
});
document.addEventListener('pointerup', () => {
  if (!dd) return; const d = dd; dd = null; if (!d.moved) return;
  const sh = document.getElementById('dsheet'), H = dHeights(), now = sh.offsetHeight; sh.classList.remove('drag');
  suppressUntil = performance.now() + 300;
  const cands = S.dsheet.startsWith('sel') ? ['sel', 'seldetail'] : ['peek', 'full'];
  const to = cands.reduce((a, b) => Math.abs(H[a] - now) < Math.abs(H[b] - now) ? a : b);
  if (to === S.dsheet) { sh.style.height = H[to] + 'px'; } else setDetent(to);
});
document.addEventListener('wheel', e => {
  const sh = document.getElementById('dsheet'); if (S.variant !== 'D' || !sh?.contains(e.target) || performance.now() - dLast < 500) return;
  const top = document.getElementById('dbody').scrollTop <= 0, down = e.deltaY > 0;
  const to = { peek: down && 'full', full: !down && top && 'peek', sel: down && 'seldetail', seldetail: !down && top && 'sel' }[S.dsheet];
  if (to) setDetent(to);
}, { passive: true });

// ---------- switcher ----------
function setVariant(v) {
  S.variant = v; S.screen = v === 'B' ? 'profile' : 'list'; S.dsheet = 'peek'; S.sheet = null; S.editing = false; S.openRow = null; S.q = ''; aVB = null;
  if (S.pending) finalizeDelete(); S.toast = null;
  if (location.hash !== '#' + v) history.replaceState(null, '', '#' + v);
  render();
}
const step = d => setVariant(KEYS[(KEYS.indexOf(S.variant) + d + KEYS.length) % KEYS.length]);
document.getElementById('prev').onclick = () => step(-1);
document.getElementById('next').onclick = () => step(1);
document.getElementById('t-empty').onclick = e => { S.empty = !S.empty; S.dsheet = 'peek'; aVB = null; S.screen = S.variant === 'B' && S.screen === 'profile' ? 'profile' : 'list'; e.currentTarget.setAttribute('aria-pressed', S.empty); render(); };
document.getElementById('t-prof').onclick = e => { S.profile = !S.profile; e.currentTarget.setAttribute('aria-pressed', S.profile); render(); };
document.getElementById('t-state').onclick = e => { const p = document.getElementById('statepanel'); p.hidden = !p.hidden; e.currentTarget.setAttribute('aria-pressed', !p.hidden); };
addEventListener('keydown', e => {
  if (e.target.closest('input, textarea, [contenteditable]')) return;
  if (e.key === 'ArrowLeft') step(-1); if (e.key === 'ArrowRight') step(1);
});
addEventListener('hashchange', () => { const v = location.hash.slice(1).toUpperCase(); if (KEYS.includes(v) && v !== S.variant) setVariant(v); });
addEventListener('resize', () => { aVB = null; render(); });
setVariant(KEYS.includes(location.hash.slice(1).toUpperCase()) ? location.hash.slice(1).toUpperCase() : 'A');
</script>
